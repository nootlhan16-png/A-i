org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Run the Kotlin compiler inside Gradle's own process instead of a separate,
# long-lived Kotlin daemon. This prevents an old Kotlin daemon (started under
# a wrong/too-new JDK) from lingering in the background and crashing builds
# even after fixing the JDK version elsewhere.
kotlin.compiler.execution.strategy=in-process
